name: Update Subscription

on:
  workflow_dispatch:
  schedule:
    # 每 6 小时运行一次
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    environment: boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 代理配置优先使用仓库里的 sub.yaml。
      # 只有仓库没有 sub.yaml 时才使用 BOOTSTRAP_PROXY。
      # 代理初始化/探测失败时直接让 Action 失败，禁止静默降级为直连。
      - name: Start mihomo proxy
        id: proxy
        env:
          BOOTSTRAP_PROXY: ${{ secrets.BOOTSTRAP_PROXY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p mihomo

          if [ -s sub.yaml ]; then
            echo "使用仓库中的 sub.yaml"
            SUB_CONFIG="sub.yaml"
          elif [ -n "${BOOTSTRAP_PROXY:-}" ]; then
            echo "仓库中没有 sub.yaml，使用 BOOTSTRAP_PROXY"
            curl -fsSL \
              --retry 3 \
              --connect-timeout 15 \
              --max-time 60 \
              "$BOOTSTRAP_PROXY" \
              -o mihomo/sub.yaml
            test -s mihomo/sub.yaml
            SUB_CONFIG="mihomo/sub.yaml"
          else
            echo "::error::没有可用的代理订阅：sub.yaml 不存在且 BOOTSTRAP_PROXY 为空。"
            exit 1
          fi

          asset=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r \
              '.assets[]
              | select(.name | test("^mihomo-linux-amd64-v[0-9][^-]*\\.gz$"))
              | .browser_download_url' \
            | head -1)

          if [ -z "$asset" ]; then
            echo "::error::找不到 mihomo 下载地址。"
            exit 1
          fi

          curl -fsSL --retry 3 "$asset" -o mihomo/mihomo.gz
          gunzip -f mihomo/mihomo.gz
          chmod +x mihomo/mihomo

          node scripts/make-proxy-config.js \
            "$SUB_CONFIG" \
            mihomo/config.yaml

          mihomo/mihomo \
            -d mihomo \
            -f mihomo/config.yaml \
            > mihomo/mihomo.log 2>&1 &

          MIHOMO_PID=$!
          echo "$MIHOMO_PID" > mihomo/mihomo.pid

          cleanup() {
            if kill -0 "$MIHOMO_PID" 2>/dev/null; then
              kill "$MIHOMO_PID" || true
              wait "$MIHOMO_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          echo "mihomo 已启动，等待代理就绪..."

          for i in $(seq 1 30); do
            if curl -fsS \
              -m 8 \
              -x http://127.0.0.1:7890 \
              -o /dev/null \
              https://wulass.org/api/v1/guest/comm/config; then
              echo "代理就绪（第 ${i} 次探测）"
              echo "url=http://127.0.0.1:7890" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if ! kill -0 "$MIHOMO_PID" 2>/dev/null; then
              echo "::error::mihomo 进程已经退出。"
              tail -80 mihomo/mihomo.log || true
              exit 1
            fi

            sleep 3
          done

          echo "::error::mihomo 代理不可用，拒绝降级为直连。"
          echo "---------- mihomo.log ----------"
          tail -80 mihomo/mihomo.log || true
          echo "--------------------------------"
          exit 1

      - name: Register and fetch subscription
        env:
          PROXY_URL: ${{ steps.proxy.outputs.url }}
        run: npm run solve

      - name: Stop mihomo
        if: always()
        run: |
          if [ -f mihomo/mihomo.pid ]; then
            kill "$(cat mihomo/mihomo.pid)" 2>/dev/null || true
          fi

      - name: Commit updated subscription
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add sub.yaml sub-info.json

          if git diff --cached --quiet; then
            echo "订阅内容无变化，跳过提交"
            exit 0
          fi

          git commit \
            -m "chore: refresh subscription ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          for i in 1 2 3; do
            if git push; then
              echo "推送成功"
              exit 0
            fi

            echo "推送失败，第 $i 次重试..."

            git pull \
              --rebase \
              --autostash \
              origin "${GITHUB_REF_NAME}"
          done

          echo "::error::推送失败"
          exit 1

      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            mihomo/mihomo.log
            mihomo/config.yaml
            sub-info.json
          if-no-files-found: ignore
          retention-days: 3
