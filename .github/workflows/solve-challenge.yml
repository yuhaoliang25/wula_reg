name: Update Subscription

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 02:23 (北京时间 10:23) 跑一次。
    # 订阅是注册后 24h 到期, 想更保险可以再加一行, 例如 '23 14 * * *'。
    - cron: '23 2 * * *'

permissions:
  contents: write

# 避免手动触发和定时任务同时跑, 造成 push 冲突
concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Register and fetch subscription
        run: npm run solve

      - name: Commit updated subscription
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add sub.yaml sub-info.json

          if git diff --cached --quiet; then
            echo "订阅内容无变化, 跳过提交"
            exit 0
          fi

          git commit -m "chore: refresh subscription ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          # 定时任务和手动触发可能撞车, 失败就 rebase 后重试
          for i in 1 2 3; do
            if git push; then
              echo "推送成功"
              exit 0
            fi
            echo "推送失败, 第 $i 次重试…"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "::error::推送失败" && exit 1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            sub-info.json
          if-no-files-found: ignore
          retention-days: 3
