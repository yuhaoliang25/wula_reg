name: Update Subscription

on:
  workflow_dispatch:
  schedule:
    # 每 6 小时运行一次
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    environment: boot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 使用 BOOTSTRAP_PROXY 指定的 YAML 订阅作为 mihomo 配置来源。
      #
      # 优先级：
      #   1. BOOTSTRAP_PROXY secret -> 下载 YAML -> mihomo
      #   2. 仓库里的 sub.yaml       -> mihomo
      #   3. 没有代理配置             -> 直连
      #
      # 注意：
      # BOOTSTRAP_PROXY 现在不再是代理地址，而是 YAML 文件/订阅 URL。
      - name: Start mihomo proxy
        id: proxy
        env:
          BOOTSTRAP_PROXY: ${{ secrets.BOOTSTRAP_PROXY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          emit() {
            echo "url=$1" >> "$GITHUB_OUTPUT"
          }

          mkdir -p mihomo

          # ------------------------------------------------------------
          # 1. 如果设置了 BOOTSTRAP_PROXY：
          #    把它当作 YAML URL 下载下来
          # ------------------------------------------------------------
          if [ -n "${BOOTSTRAP_PROXY:-}" ]; then
            echo "使用 BOOTSTRAP_PROXY 提供的 YAML 配置"

            if ! curl -fsSL \
              --connect-timeout 15 \
              --max-time 60 \
              "$BOOTSTRAP_PROXY" \
              -o mihomo/sub.yaml; then

              echo "::warning::无法下载 BOOTSTRAP_PROXY 指定的 YAML"
              emit ""
              exit 0
            fi

            if [ ! -s mihomo/sub.yaml ]; then
              echo "::warning::下载得到的 YAML 文件为空"
              emit ""
              exit 0
            fi

            echo "YAML 下载成功"
            echo "文件大小: $(wc -c < mihomo/sub.yaml) bytes"

            SUB_CONFIG="mihomo/sub.yaml"

          # ------------------------------------------------------------
          # 2. 没有 BOOTSTRAP_PROXY，则使用仓库里的 sub.yaml
          # ------------------------------------------------------------
          elif [ -f sub.yaml ]; then
            echo "使用仓库中的 sub.yaml"

            SUB_CONFIG="sub.yaml"

          # ------------------------------------------------------------
          # 3. 没有任何代理配置
          # ------------------------------------------------------------
          else
            echo "::warning::没有 BOOTSTRAP_PROXY，也没有 sub.yaml，改为直连"
            emit ""
            exit 0
          fi

          # ------------------------------------------------------------
          # 下载最新 mihomo
          # ------------------------------------------------------------
          asset=$(curl -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r \
              '.assets[]
              | select(.name | test("^mihomo-linux-amd64-v[0-9][^-]*\\.gz$"))
              | .browser_download_url' \
            | head -1)

          if [ -z "$asset" ]; then
            echo "::warning::找不到 mihomo 下载地址，改为直连"
            emit ""
            exit 0
          fi

          echo "下载 mihomo"

          if ! curl -fsSL "$asset" \
            -o mihomo/mihomo.gz; then

            echo "::warning::mihomo 下载失败，改为直连"
            emit ""
            exit 0
          fi

          if ! gunzip -f mihomo/mihomo.gz; then
            echo "::warning::mihomo 解压失败，改为直连"
            emit ""
            exit 0
          fi

          chmod +x mihomo/mihomo

          # ------------------------------------------------------------
          # 根据订阅节点生成 mihomo 配置
          # ------------------------------------------------------------
          if ! node scripts/make-proxy-config.js \
            "$SUB_CONFIG" \
            mihomo/config.yaml; then

            echo "::warning::生成 mihomo 配置失败，改为直连"
            emit ""
            exit 0
          fi

          # ------------------------------------------------------------
          # 启动 mihomo
          # ------------------------------------------------------------
          mihomo/mihomo \
            -d mihomo \
            -f mihomo/config.yaml \
            > mihomo/mihomo.log 2>&1 &

          echo $! > mihomo/mihomo.pid

          echo "mihomo 已启动，等待代理就绪..."

          # ------------------------------------------------------------
          # 等待 mihomo 选出可用节点
          #
          # 直接使用 wulass.org 作为探针：
          # 同时验证：
          #   1. mihomo 已经启动
          #   2. 节点能够正常连接
          #   3. wulass.org 能通过该节点访问
          # ------------------------------------------------------------
          ok=""

          for i in $(seq 1 30); do
            if curl -s \
              -m 8 \
              -x http://127.0.0.1:7890 \
              -o /dev/null \
              https://wulass.org/api/v1/guest/comm/config; then

              ok=1
              echo "代理就绪（第 ${i} 次探测）"
              break
            fi

            sleep 3
          done

          # ------------------------------------------------------------
          # 代理不可用
          # ------------------------------------------------------------
          if [ -z "$ok" ]; then
            echo "::warning::mihomo 代理不可用，改为直连"

            echo "---------- mihomo.log ----------"
            tail -30 mihomo/mihomo.log || true
            echo "--------------------------------"

            emit ""
            exit 0
          fi

          # ------------------------------------------------------------
          # 给 Playwright 使用本地 mihomo
          # ------------------------------------------------------------
          emit "http://127.0.0.1:7890"

      # --------------------------------------------------------------
      # 注册并获取新的订阅
      # --------------------------------------------------------------
      - name: Register and fetch subscription
        env:
          PROXY_URL: ${{ steps.proxy.outputs.url }}
        run: npm run solve

      # --------------------------------------------------------------
      # 停止 mihomo
      # --------------------------------------------------------------
      - name: Stop mihomo
        if: always()
        run: |
          if [ -f mihomo/mihomo.pid ]; then
            kill "$(cat mihomo/mihomo.pid)" 2>/dev/null || true
          fi
          exit 0

      # --------------------------------------------------------------
      # 提交更新后的订阅
      # --------------------------------------------------------------
      - name: Commit updated subscription
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add sub.yaml sub-info.json

          if git diff --cached --quiet; then
            echo "订阅内容无变化，跳过提交"
            exit 0
          fi

          git commit \
            -m "chore: refresh subscription ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          for i in 1 2 3; do
            if git push; then
              echo "推送成功"
              exit 0
            fi

            echo "推送失败，第 $i 次重试..."

            git pull \
              --rebase \
              --autostash \
              origin "${GITHUB_REF_NAME}"
          done

          echo "::error::推送失败"
          exit 1

      # --------------------------------------------------------------
      # 失败时上传 mihomo 日志
      # --------------------------------------------------------------
      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            mihomo/mihomo.log
            mihomo/config.yaml
            sub-info.json
          if-no-files-found: ignore
          retention-days: 3

