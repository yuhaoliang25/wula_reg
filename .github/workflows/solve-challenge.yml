name: Update Subscription

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    environment: boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare fresh bootstrap node pool
        run: |
          set -euo pipefail
          mkdir -p mihomo
          node scripts/fetch-bootstrap.js mihomo/bootstrap.yaml
      - name: Install latest mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-v[0-9][^-]*\\.gz$")) | .browser_download_url' | head -1)
          test -n "$asset"
          curl -fsSL --retry 3 "$asset" -o mihomo/mihomo.gz
          gunzip -f mihomo/mihomo.gz
          chmod +x mihomo/mihomo
          node scripts/make-proxy-config.js mihomo/bootstrap.yaml mihomo/config.yaml
          mihomo/mihomo -d mihomo -f mihomo/config.yaml > mihomo/mihomo.log 2>&1 &
          MIHOMO_PID=$!
          echo "$MIHOMO_PID" > mihomo/mihomo.pid
          sleep 5
          if ! kill -0 "$MIHOMO_PID" 2>/dev/null; then
            echo "::error::mihomo 启动失败"
            tail -200 mihomo/mihomo.log || true
            exit 1
          fi
      - name: Find a working node for wulass.org
        env:
          WULA_HEALTH_URL: https://wulass.org/api/v1/guest/comm/config
        run: |
          set -euo pipefail
          echo "开始通过 WULA_AUTO 检测实际可用出口..."
          for i in 1 2 3 4 5 6; do
            if curl -fsS --proxy http://127.0.0.1:7890 --connect-timeout 8 --max-time 20 -H 'Accept: application/json' "$WULA_HEALTH_URL" -o /tmp/wula-config.json; then
              if jq -e '.data != null' /tmp/wula-config.json >/dev/null 2>&1; then
                echo "✓ wulass.org 可达，自动节点选择成功"
                exit 0
              fi
            fi
            echo "第 $i 次健康检查失败，等待自动切换..."
            sleep 10
          done
          echo "::error::节点池中暂时没有能访问 wulass.org 的节点"
          exit 1
      - name: Register and fetch subscription
        id: solve
        env:
          PROXY_URL: http://127.0.0.1:7890
        run: npm run solve
      - name: Diagnose mihomo after solve failure
        if: steps.solve.outcome == 'failure'
        run: |
          echo '===== mihomo process ====='
          ps -ef | grep '[m]ihomo' || true
          echo '===== mihomo log (last 250 lines) ====='
          tail -250 mihomo/mihomo.log || true
          echo '===== generated proxy groups ====='
          grep -nE '^(proxy-groups:|  - name: WULA_AUTO|    type: url-test|    url:|    interval:)' mihomo/config.yaml || true
          exit 1
      - name: Stop mihomo
        if: always()
        run: |
          if [ -f mihomo/mihomo.pid ]; then kill "$(cat mihomo/mihomo.pid)" 2>/dev/null || true; fi
      - name: Commit updated subscription
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sub.yaml sub-info.json
          if git diff --cached --quiet; then echo "订阅内容无变化，跳过提交"; exit 0; fi
          git commit -m "chore: refresh subscription ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3; do
            if git push; then echo "推送成功"; exit 0; fi
            echo "推送失败，第 $i 次重试..."
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          done
          echo "::error::推送失败"
          exit 1
      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            mihomo/mihomo.log
            mihomo/config.yaml
            mihomo/bootstrap.yaml
            sub-info.json
          if-no-files-found: ignore
          retention-days: 3
