name: My Scheduled Workflow
on:
  schedule:
    - cron: "0 0 * * *" # 每天午夜运行

jobs:
  main-job:
    name: Main Job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ... 你的主要业务逻辑 ...

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }} # 确保即使主任务失败，保活任务也会运行
    needs: main-job
    runs-on: ubuntu-latest
    permissions:
      actions: write # v2 版本只需要 actions 写入权限，不需要 contents 写入权限
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
